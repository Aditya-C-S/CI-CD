name: Phase 5 Failure - Log Forwarding Example

on:
  workflow_dispatch:
    inputs:
      log_api_url:
        description: "Log Pipeline API URL (optional, uses secret if not provided)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  phase5-failure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests  # Required by log forwarder

      - name: Execute with Log Forwarding (Failure)
        env:
          GH_LOG_API_URL: ${{ inputs.log_api_url || secrets.LOG_API_URL || 'https://localhost:8000' }}
          GH_LOG_API_KEY: ${{ secrets.LOG_API_KEY }}
          GH_LOG_STRICT: "false"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/gh_run_with_logs.py \
            python -c "print('Phase 5 Failure Test'); import sys; sys.exit(1)"
        continue-on-error: true

      - name: Verify Logs Forwarded (Even on Failure)
        if: always()
        run: |
          echo "✅ Phase 5 Failure Test: Logs forwarded even with command failure"
          echo "API URL: ${{ env.GH_LOG_API_URL }}"
